<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Price ribbon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes psreveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes psdrop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pssnap{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div role="img" aria-label="{{aria}}" style="{{vars}};position:relative;width:100%;box-sizing:border-box;height:{{totalH}}px;font-family:Geist,system-ui,sans-serif;color:var(--ink);background:{{bg}}">
<div style="position:absolute;left:0;right:0;top:{{topPad}}px;height:{{bandH}}px;border:1px solid var(--hl);border-radius:{{rad}}px;overflow:hidden;background:var(--sf)">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="4">
<div style="{{g.style}}"><sc-if value="{{g.showLabel}}" hint-placeholder-val="{{true}}"><span style="{{g.lbl}}">{{g.label}}</span></sc-if></div>
</sc-for>
</div>
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="3">
<div style="{{t.style}}"><span style="{{t.lbl}}">{{t.label}}</span></div>
</sc-for>
<sc-if value="{{hasWin}}" hint-placeholder-val="{{true}}">
<div style="{{winStyle}}"></div>
<sc-if value="{{winLabelShow}}" hint-placeholder-val="{{true}}"><div style="{{winLblStyle}}">{{winLabel}}</div></sc-if>
</sc-if>
<sc-if value="{{hasNow}}" hint-placeholder-val="{{true}}">
<div style="{{nowStyle}}"></div>
<sc-if value="{{nowLabelShow}}" hint-placeholder-val="{{true}}"><div style="{{nowLblStyle}}">{{nowLabel}}</div></sc-if>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"plan":{"editor":"enum","options":["TOU","ULO","TIERED"],"default":"TOU"},"variant":{"editor":"enum","options":["hero","full","compact","mini"],"default":"full"},"day":{"editor":"enum","options":["weekday","weekend"],"default":"weekday"},"startMin":{"editor":"int","default":0},"nowMin":{"editor":"int","default":1050},"winStart":{"editor":"int","default":1140},"winLen":{"editor":"int","default":90},"winLabel":{"editor":"text","default":"Best · 7:00 PM"},"animate":{"editor":"boolean","default":false},"$preview":{"width":1200,"height":160}}'>
class Component extends DCLogic {
renderVals() {
const p=this.props;
const TH={light:{'--bg':'#F4F3F1','--sf':'#FFFFFF','--pn':'#ECEBE7','--ink':'#1C1D24','--mu':'#6B6E76','--m2':'#5A5D65','--hl':'#D6D5D1','--bl':'#2548F6','--ul':'#DCE3FF','--of':'#B7C4FF','--md':'#6F89FF','--on':'#2548F6','--tm':'#1C1D24','--to':'#FFFFFF','--tbl':'#FFFFFF'},dark:{'--bg':'#0E0F13','--sf':'#16171D','--pn':'#1C1D24','--ink':'#F4F3F1','--mu':'#9A9DA6','--m2':'#B4B7BF','--hl':'#2A2B33','--bl':'#5C78FF','--ul':'#1E2760','--of':'#2F409A','--md':'#5C78FF','--on':'#A9B8FF','--tm':'#0E0F13','--to':'#0E0F13','--tbl':'#0E0F13'}};
const th=p.theme==='dark'?'dark':'light', dk=th==='dark';
const vars=Object.entries(TH[th]).map(([k,v])=>k+':'+v).join(';');
const plan=String(p.plan||'TOU').toUpperCase(), wk=p.day!=='weekend';
const variant=p.variant||'full';
const start=p.startMin===undefined||p.startMin===''?0:Number(p.startMin);
const now=p.nowMin===undefined||p.nowMin===''?-1:Number(p.nowMin);
const ws=p.winStart===undefined||p.winStart===''?-1:Number(p.winStart), wl=Number(p.winLen||90);
const anim=p.animate===true||p.animate==='true';
const big=variant==='hero'||variant==='full';
const bandH={hero:72,full:56,compact:14,mini:30}[variant]||56;
const topPad=big?30:6, botPad=big?44:6, rad={hero:12,full:10,compact:4,mini:6}[variant]||10;
const mono="font-family:'Geist Mono',ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;";
const per=(m)=>{
 if(plan==='ULO'){ if(m>=1380||m<420) return ['ul',3.7]; if(!wk) return ['of',9.1]; if(m>=960&&m<1260) return ['on',37.7]; return ['md',14.6]; }
 if(plan==='TIERED') return ['of',11.2];
 if(!wk) return ['of',9.1];
 if(m<420||m>=1140) return ['of',9.1]; if(m>=660&&m<1020) return ['md',14.6]; return ['on',18.9];
};
const hc=dk?'rgba(244,243,241,':'rgba(28,29,36,', onc=dk?'rgba(14,15,19,':'rgba(255,255,255,';
const pat={ul:"background-image:radial-gradient("+hc+".45) 1px,transparent 1.4px);background-size:7px 7px;",of:"background-image:repeating-linear-gradient(0deg,"+hc+".28) 0 1px,transparent 1px 6px);",md:"background-image:repeating-linear-gradient(45deg,"+hc+".38) 0 1px,transparent 1px 7px);",on:"background-image:repeating-linear-gradient(45deg,"+onc+".5) 0 1.5px,transparent 1.5px 6px),repeating-linear-gradient(-45deg,"+onc+".5) 0 1.5px,transparent 1.5px 6px);"};
const tc={ul:'var(--ink)',of:'var(--ink)',md:'var(--tm)',on:'var(--to)'};
const NAME={ul:'Ultra-low',of:'Off-peak',md:'Mid-peak',on:'On-peak'};
let raw=[],cur=null;
for(let i=0;i<96;i++){const t=start+i*15,m=((t%1440)+1440)%1440;const [k,pr]=per(m);if(cur&&cur.k===k&&cur.pr===pr)cur.n++;else{cur={k,pr,i,n:1};raw.push(cur);}}
const fmt=(m)=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;const ap=h>=12?'PM':'AM';return (h%12||12)+':'+String(mm).padStart(2,'0')+' '+ap;};
const fmtH=(m)=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60);return (h%12||12)+' '+(h>=12?'PM':'AM');};
const h24=(m)=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const segs=raw.map((g,idx)=>{
 const w=g.n/96*100,left=g.i/96*100;
 let label=NAME[g.k]+' · '+g.pr+'¢';
 if(plan==='TIERED') label='Tier 1 · 11.2¢ · same all day';
 else if(plan==='ULO'&&g.k==='of') label='Weekend off-peak · 9.1¢';
 else if(!wk&&plan==='TOU') label='Off-peak · 9.1¢ · all day';
 const need=variant==='hero'?(plan==='TIERED'?9:13):(variant==='full'?15:99);
 return {label,showLabel:big&&w>=need*0.75,style:"position:absolute;top:0;bottom:0;left:"+left+"%;width:"+w+"%;box-sizing:border-box;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap;background-color:var(--"+g.k+");"+pat[g.k]+"border-right:1px solid var(--bg);"+(anim?"animation:psreveal .5s ease-out both;animation-delay:"+(idx*0.14)+"s;":""),lbl:mono+"font-size:"+(variant==='hero'?11:10)+"px;font-weight:500;color:"+tc[g.k]+";background:transparent;"};
});
const ticks=[];
if(big){const first=Math.ceil(start/60)*60;for(let j=0;;j++){const tm=first+j*180,off=tm-start;if(off>1440)break;const left=off/1440*100;if(left>96)continue;ticks.push({label:fmtH(tm),style:"position:absolute;top:"+(topPad+bandH)+"px;left:"+left+"%;width:1px;height:6px;background:var(--mu);",lbl:mono+"position:absolute;top:8px;left:0;transform:translateX("+(left<3?'0':'-50%')+");font-size:10px;color:var(--m2);white-space:nowrap;"});}}
let hasWin=ws>=0&&wl>0, winStyle='', winLblStyle='', winLabel=p.winLabel||'';
if(hasWin){const lo=(((ws-start)%1440)+1440)%1440,left=lo/1440*100,w=Math.min(wl/1440*100,100-left);
 winStyle="position:absolute;box-sizing:border-box;left:"+left+"%;width:"+w+"%;top:"+(topPad-4)+"px;height:"+(bandH+8)+"px;border:2px solid #DDF247;border-radius:"+(rad+2)+"px;box-shadow:0 0 0 1px var(--ink),inset 0 0 0 1px var(--ink);"+(anim?"animation:pssnap .4s ease-out both;animation-delay:1.1s;":"");
 winLblStyle=mono+"position:absolute;left:"+left+"%;top:"+(topPad+bandH+24)+"px;font-size:10px;font-weight:500;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:4px;white-space:nowrap;transform:translateX("+(left>88?'-100%':'0')+");"+(anim?"animation:pssnap .4s ease-out both;animation-delay:1.2s;":"");}
const hasNow=now>=0; let nowStyle='',nowLblStyle='',nowLabel='NOW '+h24(now);
if(hasNow){const left=(((now-start)%1440)+1440)%1440/1440*100;
 nowStyle="position:absolute;left:"+left+"%;top:"+(big?20:0)+"px;bottom:"+(big?botPad-10:0)+"px;width:2px;margin-left:-1px;background:var(--bl);"+(anim?"animation:psdrop .35s ease-out both;animation-delay:.8s;":"");
 const tr=left<8?'0':(left>92?'-100%':'-50%');
 nowLblStyle=mono+"position:absolute;left:"+left+"%;top:0;transform:translateX("+tr+");font-size:10px;font-weight:500;background:var(--bl);color:var(--tbl);padding:3px 8px;border-radius:4px;white-space:nowrap;";}
const aria='24-hour price ribbon, '+plan+' plan'+(wk?' weekday':' weekend')+': '+raw.map(g=>NAME[g.k]+' '+g.pr+'¢ from '+fmt(start+g.i*15)).join('; ')+(hasWin?'. Best window starts '+fmt(ws)+'.':'');
return {vars,bg:p.bg||'transparent',aria,segs,ticks,totalH:topPad+bandH+botPad,topPad,bandH,rad,hasWin,winStyle,winLblStyle,winLabel,winLabelShow:hasWin&&big&&!!winLabel,hasNow,nowStyle,nowLblStyle,nowLabel,nowLabelShow:hasNow&&big};
}
}
</script>
</body>
</html>
